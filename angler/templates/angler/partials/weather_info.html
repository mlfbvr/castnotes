{% if form %}
<textarea
    id="id_weather_conditions"
    name="weather_conditions"
    class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
    hx-get="/weather/?location={{ form.catch_location.value }}&form=true"
    hx-trigger="change delay:500ms from:#id_catch_location"
    hx-target="#id_weather_conditions"
    hx-swap="outerHTML"
>Conditions: {{ weather_data.weather.0.description }}; Temperature: {{ weather_data.main.temp }}°C; Humidity: {{ weather_data.main.humidity }}%; Wind Speed: {{ weather_data.wind.speed }} m/s</textarea>
{% else %}
<div class="mt-4 w-5/6 mx-auto text-center">
    <div class="font-bold text-green-600">{{ time }}</div>
    {% if error %}
        <div class="text-red-600 font-semibold">Error: {{ error }}</div>
    {% else %} 
        <p id="conditions">Conditions: {{ weather_data.weather.0.description }}; Temperature: {{ weather_data.main.temp }}°C; Humidity: {{ weather_data.main.humidity }}%; Wind Speed: {{ weather_data.wind.speed }} m/s</p>
    {% endif %}
</div>
{% endif %}
